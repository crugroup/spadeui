name: Docker Image CI

on:
  push:
    branches:
      - "develop"
      - "main"
    tags:
      - "*"
  pull_request:
    branches:
      - "develop"
      - "main"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit tests
        run: yarn test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'amd64,arm64'
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Github Registry
        id: meta_ghcr
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/crugroup/spadeui
          tags: |
            type=ref,event=branch,suffix=-${{ github.run_number }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
  
      - name: Build and push Docker image to Github Registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/production.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
